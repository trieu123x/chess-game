# ============================================================
# DCGS Game Server - cau hinh
#
# Moi kich ban thuc nghiem doi bang file nay, KHONG sua code
# (dieu kien de ket qua tai lap duoc - xem EXPERIMENTS.md).
# ============================================================

# ---------- mang ----------
server.port=5555
server.bind=0.0.0.0             # X11: bind localhost se chan may khac trong LAN
server.io=nio                   # nio | blocking          -> thi nghiem E2
server.format=binary            # binary | json           -> thi nghiem E3
server.ioWorkers=4
server.gamePoolSize=8
server.maxConnections=1000      # vuot -> ERROR 4003 (X08)

# ---------- quan ly ket noi ----------
conn.preLoginTimeoutMs=10000    # X02: ket noi im lang bi dong
conn.maxMsgPerSec=50            # X03: rate limit -> ERROR 4005
conn.sendQueueMax=256           # X04: backpressure
game.actorQueueMax=1000         # X53: hang doi moi ban
heartbeat.intervalMs=5000
heartbeat.timeoutMs=15000
reconnect.graceMs=60000
session.ttlMs=3600000           # X12: tu gia han khi con van IN_PROGRESS

# ---------- dong ho ----------
clock.compensation=true         # true | false            -> thi nghiem E4
clock.compensationCapMs=200     # X33: tran bu, chong khai RTT gia
draw.offerCooldownPlies=10      # X30: chong spam xin hoa

# ---------- rules service ----------
rules.mode=remote               # remote | embedded       -> thi nghiem E7
rules.endpoints=127.0.0.1:6001,127.0.0.1:6002
rules.poolPerEndpoint=4
rules.timeoutMs=200
rules.retries=2
rules.cacheSize=50000
rules.breaker.failures=5
rules.breaker.openMs=15000

# ---------- database (PostgreSQL 18) ----------
db.url=jdbc:postgresql://127.0.0.1:5432/dcgs
db.user=dcgs_app
db.password=dcgs_app_pw
db.poolSize=8
db.queueMax=10000               # X45: day -> ghi tam ra pending-moves.log
db.connectionTimeoutMs=2000     # X47: can pool -> ERROR 4002

# ---------- log ----------
log.level=INFO                  # X55: PHAI de INFO khi chay thuc nghiem
log.frames=false                # true chi de debug protocol, lam cham do luong
