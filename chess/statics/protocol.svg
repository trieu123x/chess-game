<text x="289" y="452" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">promo</text>
<text x="289" y="471" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u8</text>
<rect x="320" y="428" width="62" height="50" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="351" y="452" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">flags</text>
<text x="351" y="471" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u8</text>
