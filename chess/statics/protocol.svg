<text x="520" y="471" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u32 ms</text>
<rect x="566" y="428" width="74" height="50" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="603" y="452" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">tsOff</text>
<text x="603" y="471" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u16</text>
<text x="60" y="512" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">flags: bit0 an quan · bit1 nhap thanh · bit2 bat tot qua duong · bit3 phong cap · bit4 chieu · bit5 chieu het · bit6 hoa</text>
<text x="60" y="530" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">Ca hai dong ho di kem moi nuoc: server la nguon chan ly duy nhat ve thoi gian.</text>
<text x="60" y="582" font-size="15" fill="#111827" text-anchor="start" font-weight="600">3. Mot van dau, tu dang nhap den ket thuc</text>
<rect x="158" y="606" width="184" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<text x="250" y="633" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600">Client</text>
<text x="250" y="666" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">Java / Node / trinh duyet</text>
<line x1="250" y1="674" x2="250" y2="985" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="4 4"/>
