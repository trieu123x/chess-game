<line x1="760" y1="846" x2="1010" y2="846" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="885" y="838" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">VALIDATE</text>
<line x1="1010" y1="890" x2="760" y2="890" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="885" y="882" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">RULES_OK {fen, san, flags}</text>
<line x1="760" y1="920" x2="250" y2="920" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="505" y="912" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">MOVE_APPLIED  (16 byte)</text>
<text x="505" y="936" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">tru gio = (t_recv - t_gui_state) - min(rtt/2, 200 ms)</text>
<text x="505" y="968" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400" font-style="italic">... lap lai cho tung nuoc ...</text>
