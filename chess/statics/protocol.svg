<text x="428" y="452" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">clockW</text>
<text x="428" y="471" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u32 ms</text>
