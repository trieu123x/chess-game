<text x="590" y="40" font-size="23" fill="#111827" text-anchor="middle" font-weight="700">CGP v1.2 — Chess Game Protocol</text>
<text x="590" y="63" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">Giao thuc nhi phan tu thiet ke, client &lt;-&gt; server, tren TCP</text>
<text x="60" y="110" font-size="15" fill="#111827" text-anchor="start" font-weight="600">1. Khung truyen — tu dong khung vi TCP la dong byte khong co ranh gioi message</text>
<rect x="60" y="128" width="150" height="58" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="135" y="152" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">LEN</text>
<text x="135" y="171" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u32</text>
<text x="135" y="203" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">= 5 + len(PAYLOAD)</text>
<rect x="210" y="128" width="95" height="58" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="257.5" y="152" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">TYPE</text>
<text x="257.5" y="171" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u8</text>
<text x="257.5" y="203" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">bang A2</text>
<rect x="305" y="128" width="130" height="58" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="370" y="152" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">SEQ</text>
<text x="370" y="171" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u32</text>
<text x="370" y="203" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">so thu tu</text>
<rect x="435" y="128" width="325" height="58" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="597.5" y="152" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">PAYLOAD</text>
<text x="597.5" y="171" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">LEN - 5 byte</text>
<text x="597.5" y="203" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">JSON hoac nhi phan</text>
<text x="60" y="222" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Big-endian. LEN khong tinh 4 byte cua chinh no. LEN &gt; 65536 -&gt; ERROR 2003 va dong ket noi.</text>
<text x="60" y="240" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Bo giai ma phai xu ly duoc nua frame (half-packet) va nhieu frame dinh lien trong mot lan doc.</text>
<text x="60" y="288" font-size="15" fill="#111827" text-anchor="start" font-weight="600">2. Duong nong dung nhi phan — khong gui FEN, client tu ap nuoc di (delta encoding)</text>
<text x="60" y="316" font-size="13" fill="#111827" text-anchor="start" font-weight="600" font-family="ui-monospace, Consolas, monospace">MOVE (0x06) — client gui len, 8 byte</text>
<rect x="60" y="326" width="84" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="102" y="350" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">from</text>
<text x="102" y="369" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u8</text>
<rect x="144" y="326" width="84" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="186" y="350" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">to</text>
<text x="186" y="369" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u8</text>
