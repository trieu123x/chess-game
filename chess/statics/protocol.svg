<text x="270" y="350" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">promo</text>
<text x="270" y="369" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u8</text>
<rect x="312" y="326" width="84" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="354" y="350" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">flags</text>
<text x="354" y="369" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u8</text>
<rect x="396" y="326" width="96" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="444" y="350" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">ply</text>
<text x="444" y="369" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u16</text>
<rect x="492" y="326" width="96" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="540" y="350" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">reserved</text>
<text x="540" y="369" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u16</text>
<text x="604" y="356" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">o co: 0..63, a1 = 0</text>
<text x="604" y="373" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">promo: 0=khong 1=N 2=B 3=R 4=Q</text>
<text x="60" y="418" font-size="13" fill="#111827" text-anchor="start" font-weight="600" font-family="ui-monospace, Consolas, monospace">MOVE_APPLIED (0x83) — server tra ve, 16 byte</text>
<rect x="60" y="428" width="74" height="50" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="97" y="452" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Consolas, monospace">ply</text>
<text x="97" y="471" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace, Consolas, monospace">u16</text>
